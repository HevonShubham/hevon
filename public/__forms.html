<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HEVON forms</title>
  </head>
  <body>
    <form name="hevon-waitlist" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="hevon-waitlist" />
      <input type="hidden" name="subject" value="New HEVON website lead" />
      <input name="source" type="text" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="age-band" type="text" />
      <input name="gender" type="text" />
      <input name="state" type="text" />
      <input name="city" type="text" />
      <input name="expected-flavour" type="text" />
      <input name="pin-code" type="text" />
      <input name="diet" type="text" />
      <input name="coffee-profile" type="text" />
      <input name="frequency" type="text" />
      <input name="price-comfort" type="text" />
      <input name="purchase-intent" type="text" />
      <input name="marketing-consent" type="text" />
      <input name="weight-kg" type="text" />
      <input name="estimated-protein-g" type="text" />
      <input name="bot-field" type="text" />
    </form>

    <form name="flavour-vote" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="flavour-vote" />
      <input type="hidden" name="subject" value="New HEVON flavour vote" />
      <input name="source" type="text" />
      <input name="flavour" type="text" />
      <input name="email" type="email" />
      <input name="bot-field" type="text" />
    </form>

    <form name="hevon-feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="hevon-feedback" />
      <input type="hidden" name="subject" value="New HEVON Taste Lab response" />
      <input name="source" type="text" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="city" type="text" />
      <input name="coffee-strength" type="text" />
      <input name="awareness-driver" type="text" />
      <textarea name="purchase-feedback"></textarea>
      <input name="bot-field" type="text" />
    </form>
  </body>
</html>
