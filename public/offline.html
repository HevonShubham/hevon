<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2b1d16"><title>HEVON · Offline</title><style>body{background:#fffaf1;color:#2b1d16;font-family:Arial,sans-serif;margin:0;padding:35px;min-height:80vh;display:grid;place-content:center}main{max-width:420px}h1{font-size:48px;letter-spacing:-2px}p{line-height:1.8;color:#646d5b}a,button{display:inline-block;background:#2b1d16;color:white;padding:16px 22px;border:0;border-radius:5px;text-decoration:none;margin:12px 8px 0 0;cursor:pointer}button{background:transparent;color:#2b1d16;border:1px solid #2b1d16}small{display:block;margin-top:24px;color:#646d5b}</style><main><img src="/icons/hevon-192.png" width="64" height="64" alt="HEVON"><h1>A little pause.</h1><p>You’re offline. Connect to the internet to explore the latest drop, join the waitlist or continue to checkout.</p><p id="cart" role="status"></p><a href="/app">Try again</a><button id="clear" hidden>Clear saved cart</button><small>No order has been placed while offline.</small></main><script>const key='hevon-cart-v1';let count=0;try{const n=JSON.parse(localStorage.getItem(key)||'0');if(Number.isInteger(n))count=Math.max(0,Math.min(12,n));}catch{}const label=document.getElementById('cart'),clear=document.getElementById('clear');function render(){label.textContent=count?`${count} bottle${count===1?'':'s'} saved in your launch cart on this device.`:'Your cart is empty.';clear.hidden=!count;}render();clear.onclick=()=>{try{localStorage.removeItem(key);}catch{}count=0;render();};</script></html>
